# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# ---------------------------------------------------------------------------
# otel-collector-config.yaml — OTel Collector config for local file export
#
# Receives OTLP from the Functions app and writes structured JSONL files
# to /otel-export/ (bind-mounted to ./otel-export/ on the host).
#
# Usage: runs automatically as an Aspire container resource.
# Output: ./otel-export/traces.jsonl, metrics.jsonl, logs.jsonl
# ---------------------------------------------------------------------------

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file/traces:
    path: /otel-export/traces.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 3
  file/metrics:
    path: /otel-export/metrics.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 3
  file/logs:
    path: /otel-export/logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 3

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
